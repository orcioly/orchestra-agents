name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test (mux stub + fake backends: no zellij or AI CLI needed)
        run: bash tests/smoke.sh

      - name: ShellCheck (informational)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning bin/orchestra lib/*.sh agents/*.sh scripts/*.sh install.sh uninstall.sh tests/smoke.sh
